name: Publish to AUR

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  aur:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Extract version
        id: version
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "pkgver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate PKGBUILD
        env:
          PKGVER: ${{ steps.version.outputs.pkgver }}
          REPO: ${{ github.repository }}
        run: |
          # Download the source tarball and compute its checksum
          SOURCE_URL="https://github.com/${REPO}/archive/refs/tags/v${PKGVER}.tar.gz"
          SHA256=$(curl -sL "$SOURCE_URL" | sha256sum | cut -d' ' -f1)

          cat > PKGBUILD <<'HEREDOC'
          # Maintainer: bjarneo <https://github.com/bjarneo>
          pkgname=tema-git
          pkgver=PKGVER_PLACEHOLDER
          pkgrel=1
          pkgdesc='Wallpaper-based theme generator for Hyprland/Omarchy'
          arch=('any')
          url='https://github.com/bjarneo/tema'
          license=('MIT')
          depends=('gjs' 'gtk4' 'libadwaita' 'imagemagick')
          source=("${pkgname}-${pkgver}.tar.gz::https://github.com/bjarneo/tema/archive/refs/tags/v${pkgver}.tar.gz")
          sha256sums=('SHA256_PLACEHOLDER')

          package() {
              cd "tema-${pkgver}"

              # Install application source
              install -dm755 "${pkgdir}/usr/share/tema"
              cp -r src templates "${pkgdir}/usr/share/tema/"

              # Install executable wrapper
              install -dm755 "${pkgdir}/usr/bin"
              cat > "${pkgdir}/usr/bin/tema" <<'WRAPPER'
          #!/bin/bash
          cd /usr/share/tema || exit
          exec gjs -m src/main.js "$@"
          WRAPPER
              chmod 755 "${pkgdir}/usr/bin/tema"

              # Install desktop file
              install -Dm644 li.oever.tema.desktop "${pkgdir}/usr/share/applications/li.oever.tema.desktop"
          }
          HEREDOC

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' PKGBUILD
          # Replace placeholders with actual values
          sed -i "s|PKGVER_PLACEHOLDER|${PKGVER}|" PKGBUILD
          sed -i "s|SHA256_PLACEHOLDER|${SHA256}|" PKGBUILD

          cat PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: tema-git
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.version.outputs.pkgver }}"
